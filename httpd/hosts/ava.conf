<VirtualHost *:443>
	ServerName			postats.apsim.info
	ServerAdmin			julian.rich@csiro.au

	# Proxy to kestrel web server running in ava-site docker image.
	ProxyPreserveHost	On
	ProxyPass 			/							http://ava-web-app/
	ProxyPassReverse 	/							http://ava-web-app/

	ErrorLog			${APACHE_LOG_DIR}/ava-error.log
	CustomLog			${APACHE_LOG_DIR}/ava-access.log common

	SSLEngine On
	SSLProxyEngine On
	ProxyAddHeaders On
</VirtualHost>

# Listen on port 80 (ie http) but redirect to 443 (https).
<VirtualHost *:80>
	ServerName			postats.apsim.info
	ServerAdmin			julian.rich@csiro.au

	ErrorLog			${APACHE_LOG_DIR}/ava-error.log
	CustomLog			${APACHE_LOG_DIR}/ava-access.log common

	RewriteEngine		On
	RewriteCond			%{SERVER_NAME} =postats.apsim.info
	RewriteRule			^							https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
	ProxyAddHeaders On
</VirtualHost>
